[package]
name = "basedpl-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false
test = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
basedpl = { path = ".." }
js-sys = ">=0.3.106, <0.4"
wasm-bindgen = ">=0.2.129, <0.3"
