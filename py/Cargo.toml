[package]
name = "basedpl-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
basedpl = { path = ".." }
bytemuck = ">=1.25.2, <2"
half = ">=2.7.1, <3"
num-bigint = ">=0.4.6, <0.5"
num-complex = ">=0.4.6, <1"
num-rational = ">=0.4.2, <1"
pyo3 = { version = ">=0.29.2, <1", features = ["extension-module", "num-bigint"] }
serde_json = "1"

[build-dependencies]
pyo3-build-config = ">=0.29.2, <1"
