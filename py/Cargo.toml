[package]
name = "basedpl-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[features]
default = ["native"]
native = ["basedpl/native"]

[dependencies]
basedpl = { path = "..", default-features = false }
num-bigint = ">=0.4.6, <0.5"
num-complex = ">=0.4.6, <1"
num-rational = ">=0.4.2, <1"
pyo3 = { workspace = true, features = ["extension-module", "num-bigint"] }
rustymath-buffer.workspace = true
rustymath.workspace = true
serde_json = "1"

[build-dependencies]
pyo3-build-config.workspace = true
