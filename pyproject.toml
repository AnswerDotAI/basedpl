[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "miniapl"
dynamic = ["version"]
description = "A small modern APL calculator in Rust, with a native CLI and Python API."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "pytest", "numpy", "conkernelclient>=0.0.23"]

[project.scripts]
miniapl = "miniapl._cli:main"

[project.urls]
Homepage = "https://github.com/AnswerDotAI/miniapl"
Repository = "https://github.com/AnswerDotAI/miniapl"
Issues = "https://github.com/AnswerDotAI/miniapl/issues"

[tool.maturin]
data = "wheel"
features = ["extension-module"]
python-source = "python"
module-name = "miniapl._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = ".git/fastws-cargo-key" }]

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
