[build-system]
requires = ["maturin>=1.9.2,<2.0"]
build-backend = "maturin"

[project]
name = "basedpl"
dynamic = ["version"]
description = "bAsedPL is an APL-derived array language, borrowing ideas from J and BQN, with an emphasis on simple, consistent notation."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
pandas = ["pandas"]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "pytest", "numpy", "pandas", "conkernelclient>=0.0.23"]

[project.scripts]
bapl = "basedpl._cli:main"

[project.urls]
Homepage = "https://github.com/AnswerDotAI/basedpl"
Repository = "https://github.com/AnswerDotAI/basedpl"
Issues = "https://github.com/AnswerDotAI/basedpl/issues"

[tool.maturin]
data = "wheel"
features = ["extension-module"]
python-source = "python"
module-name = "basedpl._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "python/basedpl/keyboard.json" }, { file = "Cargo.toml" }, { file = ".git/fastws-cargo-key" }]

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
