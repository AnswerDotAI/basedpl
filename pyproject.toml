[build-system]
requires = ["maturin>=1.9.2,<2.0"]
build-backend = "maturin"

[project]
name = "basedpl"
dynamic = ["version"]
description = "bAsedPL is an APL-derived array language, borrowing ideas from J and BQN, with an emphasis on simple, consistent notation."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["fastcore"]
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "pytest", "numpy", "pandas", "ipython>=9.17.1", "nbdev>=3.3.24", "conkernelclient>=0.0.23", "jlanguage"]

[project.scripts]
bapl = "basedpl._cli:main"
bapl-nb = "basedpl.notebook_runner:main"
bapl-install-magic = "basedpl.notebooks:create_ipython_config"

[project.urls]
Homepage = "https://github.com/AnswerDotAI/basedpl"
Repository = "https://github.com/AnswerDotAI/basedpl"
Issues = "https://github.com/AnswerDotAI/basedpl/issues"
Documentation = "https://answerdotai.github.io/basedpl"

[tool.maturin]
data = "wheel"
features = ["extension-module"]
python-source = "python"
module-name = "basedpl._core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "build.rs" }, { file = "nbs/**/*.qmd" }, { file = "python/basedpl/keyboard.json" }, { file = "Cargo.toml" }, { file = ".git/fastws-cargo-key" }]

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.nbdev]
lib_path = "python/basedpl"
custom_sidebar = true
tst_flags = "dyalog"
title = "bAsedPL"
put_version_in_init = false
