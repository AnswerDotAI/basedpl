[package]
name = "basedpl"
version = "0.1.6"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "bAsedPL is an APL-derived array language, borrowing ideas from J and BQN, with an emphasis on simple, consistent notation."

[lib]
name = "basedpl"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "basedpl"
path = "src/main.rs"
test = false

[profile.dev]
opt-level = 1
lto = "off"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.basedpl]
incremental = true

[profile.dist]
inherits = "release"
opt-level = 2
lto = "off"
incremental = false
codegen-units = 16
strip = true

[profile.dist.package.basedpl]
incremental = false

[dependencies]
kernmini = ">=0.1.14, <1"
anyhow = "1"
async-trait = ">=0.1, <1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
unicode-width = { version = ">=0.2.2, <1", default-features = false }
icu_casemap = ">=2, <3"
# Custom bindings override Emacs Alt-digit prefixes in this fork.
rustyline = { git = "https://github.com/AnswerDotAI/rustyline.git", branch = "master", default-features = false, features = ["custom-bindings"] }
pyo3 = { version = ">=0.29.2, <1", optional = true, features = ["num-bigint"] }
num-rational = ">=0.4.2, <1"
num-complex = ">=0.4.6, <1"
num-bigint = ">=0.4.6, <0.5"
num-traits = ">=0.2.19, <1"
libm = ">=0.2, <1"
lambert_w = ">=1.2.34, <2"
rand = ">=0.10.2, <1"
faer = { version = ">=0.24.4, <1", default-features = false, features = ["std", "linalg"] }

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
