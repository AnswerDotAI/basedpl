[package]
name = "miniapl"
version = "0.1.2"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "A small modern APL calculator in Rust, with a native CLI and Python API."

[lib]
name = "miniapl"
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "miniapl"
path = "src/main.rs"
test = false

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.miniapl]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.miniapl]
incremental = false

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
unicode-width = { version = ">=0.2.2, <1", default-features = false }
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }
pyo3 = { version = ">=0.29.2, <1", optional = true, features = ["num-bigint"] }
num-rational = ">=0.4.2, <1"
num-complex = ">=0.4.6, <1"
num-bigint = ">=0.4.6, <1"
num-traits = ">=0.2.19, <1"
libm = ">=0.2, <1"
rand = ">=0.9, <1"
faer = { version = ">=0.24.4, <1", default-features = false, features = ["std", "linalg"] }

[features]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
