[package]
name = "basedpl"
version = "0.1.21"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "BasedPL, the Based-array Programming Language, is an APL-derived array language, borrowing ideas from J and BQN, with an emphasis on simple, consistent notation."

[lib]
name = "basedpl"
crate-type = ["cdylib", "rlib"]
doctest = false
# Without a unit-test build, `cargo test` compiles the library only once.
test = false

[[bin]]
name = "bpl"
path = "src/main.rs"
test = false

[profile.test]
inherits = "release"

[profile.release]
opt-level = 2
overflow-checks = false
debug-assertions = false
incremental = true
debug = "line-tables-only"

[profile.dist]
inherits = "release"
incremental = false
strip = true

[dependencies]
csv = "1"
regex = "1"
tempfile = "3"
kernmini = ">=0.1.17, <1"
anyhow = "1"
async-trait = ">=0.1, <1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = ">=1.0.229, <2"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
unicode-width = { version = ">=0.2.2, <1", default-features = false }
icu_normalizer = ">=2, <3"
# Custom bindings override Emacs Alt-digit prefixes in this fork.
rustyline = { git = "https://github.com/AnswerDotAI/rustyline.git", branch = "master", default-features = false, features = ["custom-bindings"] }
ctrlc = ">=3.5.2, <4"
pyo3 = { version = ">=0.29.2, <1", optional = true, features = ["num-bigint"] }
libloading = { version = ">=0.8, <1", optional = true }
num-rational = ">=0.4.2, <1"
num-complex = ">=0.4.6, <1"
num-bigint = ">=0.4.6, <0.5"
num-traits = ">=0.2.19, <1"
num-integer = ">=0.1.46, <1"
strength_reduce = ">=0.2.4, <1"
libm = ">=0.2, <1"
lambert_w = ">=1.2.34, <2"
rand = ">=0.10.2, <1"
statrs = { version = ">=0.19.1, <1", default-features = false, features = ["std", "rand"] }
faer = { version = ">=0.24.4, <1", default-features = false, features = ["std", "linalg"] }
plotters = { version = ">=0.3.7, <1", default-features = false, features = ["svg_backend", "colormaps", "full_palette"] }
image = { version = ">=0.25.6, <1", default-features = false, features = ["png", "jpeg"] }
base64 = ">=0.22.1, <1"
stacker = ">=0.1.25, <1"
foldhash = ">=0.2.0, <1"
bytemuck = ">=1.25.2, <2"
flate2 = ">=1.1.10, <2"
json5 = ">=1.3.1, <2"
roxmltree = { version = ">=0.21.1, <1", default-features = false, features = ["std"] }
sha2 = ">=0.10.9, <1"
uuid = { version = ">=1.26.1, <2", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8"] }
chrono = { version = ">=0.4.45, <0.5", features = ["unstable-locales"] }
walkdir = ">=2.5.0, <3"
globset = ">=0.4.20, <1"

[target.'cfg(unix)'.dependencies]
rustix = { version = ">=1.1.5, <2", features = ["termios", "fs"] }
nix = { version = ">=0.31.3, <1", default-features = false, features = ["user"] }

[build-dependencies]
pyo3-build-config = { version = ">=0.29.2, <1", optional = true }

[features]
python = ["dep:pyo3", "dep:libloading", "dep:pyo3-build-config"]
