[package]
name = "miniapl"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A small modern APL calculator in Rust, with a native CLI and Python API."

[lib]
name = "miniapl"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.miniapl]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.miniapl]
incremental = false

[dependencies]
pyo3 = ">=0.28"

[features]
extension-module = ["pyo3/extension-module"]
