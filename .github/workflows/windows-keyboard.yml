name: Windows keyboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['editors/windows/**', 'python/basedpl/layout.json', 'python/basedpl/windows_keyboard.py', '.github/workflows/windows-keyboard.yml']
  pull_request:
    paths: ['editors/windows/**', 'python/basedpl/layout.json', 'python/basedpl/windows_keyboard.py', '.github/workflows/windows-keyboard.yml']

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Extract Microsoft's keyboard compiler
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\MSKLC.exe"
          $toolkit = "$env:RUNNER_TEMP\msklc"
          Invoke-WebRequest 'https://download.microsoft.com/download/6/f/5/6f5ce43a-e892-4fd1-b9a6-1a0cbb64e6e2/MSKLC.exe' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'CD12A6B08066133DC4AD71BDCACCF1492E3D9A1DE93CF84B7B2824309F0D7255') { throw 'MSKLC download checksum changed.' }
          7z x $archive "-o$toolkit" -y
          if ($LASTEXITCODE -ne 0) { throw 'MSKLC archive extraction failed.' }
          $msi = Get-ChildItem $toolkit -Filter MSKLC.msi -Recurse | Select-Object -First 1
          $result = Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$toolkit\image`"" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "MSKLC administrative extraction failed: $($result.ExitCode)" }
          $compiler = Get-ChildItem "$toolkit\image" -Filter kbdutool.exe -Recurse | Where-Object { $_.Directory.Name -eq 'i386' } | Select-Object -First 1
          ./editors/windows/build.ps1 -Compiler $compiler.FullName
      - uses: actions/upload-artifact@v7
        with:
          name: basedpl-keyboard-us-windows-x64
          path: dist/basedpl-keyboard-us-windows-x64.zip
