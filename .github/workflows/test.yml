name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# In each job, every test step after the first runs even when an earlier step fails, to report every test's result in one run.
jobs:
  test:
    runs-on: ubicloud-standard-4-ubuntu-2604
    steps:
      - uses: actions/checkout@v7
      # `tests/highlighting.mjs` reads the TextMate grammar through `shiki`, which `package.json` declares.
      - uses: voidzero-dev/setup-vp@v1
      - run: vp install
      - uses: dtolnay/rust-toolchain@stable
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      - uses: taiki-e/install-action@nextest
      - uses: AnswerDotAI/.github/actions/setup-uv@main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv pip install --system --config-settings-package basedpl:metadata-only=1 -e '.[test]'
      - run: cargo develop
      - run: node tests/input.mjs
      - run: node tests/highlighting.mjs
        if: ${{ !cancelled() }}
      - run: cargo nextest run --cargo-profile release -E 'not binary(speed)'
        if: ${{ !cancelled() }}
      - run: pytest -q
        if: ${{ !cancelled() }}
      - run: bpl-nb
        if: ${{ !cancelled() }}
      - run: nbdev-test
        if: ${{ !cancelled() }}

  wasm:
    runs-on: ubicloud-standard-4-ubuntu-2604
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: AnswerDotAI/.github/actions/sccache@main
        with:
          r2-url: ${{ secrets.SCCACHE_R2 }}
      # V8's frame sizes decide the recursion test's margin. Each Node major keeps one V8 version. `.node-version` pins the major for the wasm correctness checks.
      - uses: voidzero-dev/setup-vp@v1
      - run: cargo wasm --strip
      - run: node --test tests/wasm.mjs
