name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# In each job, every test step after the first runs even when an earlier step fails, to report every test's result in one run.
jobs:
  test:
    runs-on: ubicloud-standard-4-ubuntu-2604
    steps:
      - uses: actions/checkout@v7
      # The speed tests' costs for large new arrays depend on whether the kernel gives them transparent huge pages.
      - run: cat /sys/kernel/mm/transparent_hugepage/enabled
      # `tests/highlighting.mjs` reads the TextMate grammar through `shiki`, which `package.json` pins.
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      # The repository has no `Cargo.lock`. Creating one first makes rust-cache's key change when a dependency publishes a new version.
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: cargo develop
      - run: node tests/input.mjs
      - run: node tests/highlighting.mjs
        if: ${{ !cancelled() }}
      # With `BASEDPL_COSTS`, the speed tests here and in the `wasm` job log every case's cost, which `basedpl.bpltests.logged_costs` reads.
      - run: BASEDPL_COSTS=1 cargo test
        if: ${{ !cancelled() }}
      - run: pytest -q
        if: ${{ !cancelled() }}
      - run: bpl-nb
        if: ${{ !cancelled() }}
      - run: nbdev-test
        if: ${{ !cancelled() }}

  wasm:
    runs-on: ubicloud-standard-4-ubuntu-2604
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # V8's frame sizes decide the recursion test's margin. Each Node major keeps one V8 version. `.node-version` pins the major that both wasm jobs use.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: cargo generate-lockfile
      # The `Speed` workflow's `wasm` job restores this cache, by its `shared-key`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - run: cargo wasm --strip
      - run: node --test tests/wasm.mjs
      - run: BASEDPL_COSTS=1 node --no-liftoff --test tests/wasm-speed.mjs
        if: ${{ !cancelled() }}
