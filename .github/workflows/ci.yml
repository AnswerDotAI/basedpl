name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tests/input.mjs
      - uses: dtolnay/rust-toolchain@stable
      # The repository has no `Cargo.lock`. Creating one first makes rust-cache's key change when a dependency publishes a new version.
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: cargo develop
      - run: pytest
      - run: bpl-nb
      - run: nbdev-test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: cargo wasm --profile wasm
      - run: node --test tests/wasm.mjs
      # The `npm` job publishes this package on a `v*` tag.
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm/pkg

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, binary: bpl-linux-x86_64}
          - {os: ubuntu-24.04-arm, binary: bpl-linux-arm64}
          - {os: macos-latest, binary: bpl-macos-arm64}
    runs-on: ${{ matrix.os }}
    env:
      # The Python-free `bpl` goes in the wheel, through `cargo stage`, and in the GitHub release.
      STAGE_BPL: cargo stage --profile dist && mkdir -p bin && cp wheel/scripts/bpl bin/${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - if: runner.os != 'Linux'
        run: pip install 'fastws-cli>=0.0.22' && ${{ env.STAGE_BPL }}
      - uses: PyO3/maturin-action@v1
        with:
          args: --profile dist --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13
          manylinux: auto
          # This runs inside the manylinux container, whose old glibc lets the binary run on older Linux distributions.
          before-script-linux: export PATH="/opt/python/cp310-cp310/bin:$PATH" && python3.10 -m pip install 'fastws-cli>=0.0.22' && ${{ env.STAGE_BPL }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: bpl-${{ matrix.os }}
          path: bin

  sdist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: bpl-*
          path: bin
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            bin/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wasm]
    runs-on: ubuntu-latest
    # npm accepts this job's upload through trusted publishing. The `basedpl` package's settings on npmjs.com name this workflow as its trusted publisher.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: wasm/pkg
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm publish
        working-directory: wasm/pkg
      # Pages load this package's files from unversioned jsDelivr URLs. Without a purge, jsDelivr can serve the previous release's files there for up to 7 days.
      - run: for file in *; do curl -fsS "https://purge.jsdelivr.net/npm/basedpl/$file"; done
        working-directory: wasm/pkg
