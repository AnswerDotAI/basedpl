name: Speed

on: workflow_dispatch

permissions:
  contents: read

jobs:
  native:
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # This job times the `bpl` that releases ship, which `cargo stage --profile dist` builds, as the `Release` workflow does. `bpl --costs` prints every case's cost and budget for `basedpl.bpltests.logged_costs`. A case over its budget doesn't fail it. The job builds without a cache. The `Test` workflow's caches hold only test-profile builds.
      - run: pip install 'fastws-cli>=0.0.25' && cargo stage --profile dist
      - run: grep -m1 'model name' /proc/cpuinfo
      - run: wheel/scripts/bpl --costs tests/speed.txt
      # `bpl-tests thread_scaling` times a large product, a 512×512 SVD and Hermitian eigendecomposition, a stack of QR decompositions and a large elementwise function on one thread and on the runner's cores, and fails when one speeds up less than 1.5 times. Speed budgets are single-thread measurements, so this is the check of multithreaded speed. It comes last, so that a failure here still leaves every cost logged.
      - run: pip install -e . && bpl-tests thread_scaling --bpl wheel/scripts/bpl

  wasm:
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - run: cargo wasm --strip
      - run: grep -m1 'model name' /proc/cpuinfo
      - run: BASEDPL_COSTS=1 node --no-liftoff tests/wasm-speed.mjs
