[package]
name = "basedpl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `bpl` command: BasedPL's REPL, Jupyter kernel and JSON-lines worker."

[[bin]]
name = "bpl"
path = "src/main.rs"
test = false

[features]
default = ["native"]
native = ["basedpl/native"]

[dependencies]
basedpl = { path = "..", default-features = false }
async-trait = ">=0.1, <1"
ctrlc = ">=3.5.2, <4"
foldhash = ">=0.2.0, <1"
kernmini = ">=0.1.20, <1"
# Custom bindings override Emacs Alt-digit prefixes in this fork.
rustyline = { git = "https://github.com/AnswerDotAI/rustyline.git", branch = "master", default-features = false, features = ["custom-bindings", "with-file-history"] }
serde = ">=1.0.229, <2"
serde_json = "1"
