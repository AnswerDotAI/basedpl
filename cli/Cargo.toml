[package]
name = "basedpl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `bpl` command: BasedPL's REPL, Jupyter kernel and JSON-lines worker."

[[bin]]
name = "bpl"
path = "src/main.rs"
test = false

[features]
default = ["native"]
native = ["basedpl/native"]

[dependencies]
basedpl = { path = "..", default-features = false }
async-trait = ">=0.1, <1"
ctrlc.workspace = true
kernmini.workspace = true
rustyline.workspace = true
rustymath.workspace = true
serde = ">=1.0.229, <2"
serde_json = "1"
