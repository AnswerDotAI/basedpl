# rustc runs LLVM's straight-line (SLP) vectorizer only at opt-level 3. `passes=slp-vectorizer` adds it to our opt-level 2 builds.
# A target's own `rustflags` replace these. The x86-64 and wasm entries repeat the pass.
[build]
rustflags = ["-C", "passes=slp-vectorizer"]

# rustymath uses Accelerate's per-thread BLAS controls on macOS.
[env]
MACOSX_DEPLOYMENT_TARGET = "15.0"

# x86-64 builds need a CPU with AVX2 (x86-64-v3). The kernels rely on its rounding and wider vector instructions.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "passes=slp-vectorizer"]

# The browser build uses wasm's 128-bit SIMD, which current browsers all support.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "-C", "passes=slp-vectorizer"]

[alias]
# Builds the npm package into `wasm/pkg/`. `xtask` builds optimised, because its wasm-bindgen pass runs on every call.
wasm = "run --release -p xtask --"
