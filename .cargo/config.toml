# Cargo joins the rustflags of every matching `target` entry. `cfg(all())` matches every target.
[target.'cfg(all())']
rustflags = ["-Zshare-generics=yes"]

# rustymath uses Accelerate's per-thread BLAS controls on macOS.
[env]
MACOSX_DEPLOYMENT_TARGET = "15.0"
RUSTC_BOOTSTRAP = "1"

# x86-64 builds need a CPU with AVX2 (x86-64-v3). The kernels rely on its rounding and wider vector instructions.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# The browser build uses wasm's 128-bit SIMD, which current browsers all support.
# Its main stack is 4 MiB, against rustc's default of 1 MiB. An evaluation then keeps `eval::room`'s 1 MiB red zone on it and grows no 16 MiB segment.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "-C", "link-arg=-zstack-size=4194304"]

[alias]
# Builds the npm package into `wasm/pkg/`. `xtask` builds optimised, because its wasm-bindgen pass runs on every call.
wasm = "run --release -p xtask --"
